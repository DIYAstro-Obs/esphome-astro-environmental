# =========================================================
# EXAMPLE: everything built
#
# BME280 (with the dew point), rain sensor, MLX90614 cloud sensor, the reed anemometer and the TSL2591 sky quality
# sensor on an ESP32 DevKit. (The shipped configuration is the same with `sqm: false`: the sky quality sensor is
# optional and has to be fitted.)
# Copy the file over esphome-astro-environmental/config/astro-environmental-config.yaml.
# =========================================================

# --- device ---
name: astro-environmental
log_level: DEBUG
hardware: esp32_devkit

# --- hardware ---
bme280: true
rain: true
sky: true
wind: true
sqm: true

# --- single values (optional) ---
sensor_temperature: true
sensor_humidity: true
sensor_pressure: true
sensor_dew_point: true
sensor_sky_temperature: true
sensor_sky_ambient: true
sensor_sky_delta: true
sensor_cloud_cover: true
sensor_wind_speed: true
sensor_wind_gust: true
sensor_sky_quality: true
sensor_sky_illuminance: true
sensor_sky_luminance: true

# --- I2C bus (BME280, MLX90614 and TSL2591) ---
pin_sda: 21
pin_scl: 22
i2c_frequency: 50kHz
bme280_address: "0x76"
mlx90614_address: "0x5A"

# --- inputs ---
pin_rain: 25
rain_inverted: true
pin_wind: 26
wind_filter: 5ms
