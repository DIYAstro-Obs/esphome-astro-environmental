# =========================================================
# EXAMPLE: rain sensor and anemometer only (no I2C sensor)
#
# Without a BME280 and without an MLX90614 the I2C bus is not set up at all.
# Copy the file over esphome-astro-environmental/config/astro-environmental-config.yaml.
# =========================================================

# --- device ---
name: astro-environmental
log_level: INFO
hardware: esp32_devkit

# --- sensors ---
bme280: false
rain: true
sky: false
wind: true

# --- I2C bus (not used here) ---
pin_sda: 21
pin_scl: 22
i2c_frequency: 50kHz
bme280_address: "0x76"
mlx90614_address: "0x5A"

# --- inputs ---
pin_rain: 25
rain_inverted: true
pin_wind: 26
wind_filter: 5ms
