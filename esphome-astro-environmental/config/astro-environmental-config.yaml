# =========================================================
# ASTRO-ENVIRONMENTAL CONFIGURATION
#
# Edit this file, then flash the device again (ESPHome dashboard: Install).
# It is one flat list of keys; every key has to be present. Wrong values stop the build with a
# message that names the problem (esphome-astro-environmental/config/checks.yaml).
#
# Hardware that is not fitted (false) is not built at all: no bus access, no entities in Home Assistant, and
# nothing that is calculated from it. Calibration values (wind factor, cloud limits) are not set here but in
# Home Assistant.
# =========================================================

# --- device ---
name: astro-environmental
log_level: DEBUG              # DEBUG | INFO | WARN (WARN for production)
hardware: esp32_devkit        # board: esphome-astro-environmental/hardware/hw_<hardware>.yaml

# --- hardware: true = fitted and built, false = not fitted (nothing of it is built) ---
bme280: true                  # BME280 chip: temperature, humidity, pressure and the dew point calculated from them
rain: true                    # rain sensor module with a digital output (one value: Rain)
sky: true                     # MLX90614 infrared thermometer: sky temperature, delta, cloud cover
wind: true                    # anemometer with a reed contact (pulse counting)
sqm: false                    # TSL2591 light sensor on the I2C bus: sky quality (SQM), illuminance, luminance

# --- single values (optional): built when their hardware above is true and the switch is true ---
# A value that is switched off is not reported to Home Assistant, and everything that is calculated from it is not
# built either: Dew Point needs Temperature and Humidity, Sky Temperature Delta needs Sky Temperature and Sky Sensor
# Ambient, Cloud Cover needs Sky Temperature Delta, Sky Luminance needs Sky Quality. Hardware whose values are all
# off is not built at all.
sensor_temperature: true      # BME280
sensor_humidity: true         # BME280
sensor_pressure: true         # BME280
sensor_dew_point: true        # calculated from temperature and humidity
sensor_sky_temperature: true  # MLX90614 object temperature
sensor_sky_ambient: true      # MLX90614 housing temperature (diagnostic)
sensor_sky_delta: true        # sky temperature minus housing temperature
sensor_cloud_cover: true      # cloud cover in % calculated from the delta
sensor_wind_speed: true       # mean of 60 s
sensor_wind_gust: true        # maximum of 10 min
sensor_sky_quality: true      # TSL2591: mag/arcsec2, one value per minute
sensor_sky_illuminance: true  # TSL2591: lx, from the same counts
sensor_sky_luminance: true    # mcd/m2, calculated from the sky quality

# --- I2C bus (BME280, MLX90614 and TSL2591; the TSL2591 answers at 0x29, fixed) ---
pin_sda: 21                   # GPIO number
pin_scl: 22                   # GPIO number
i2c_frequency: 50kHz          # slow on purpose: the sensor head is usually on a long cable
bme280_address: "0x76"        # 0x76 (SDO to GND) | 0x77 (SDO to VCC)
mlx90614_address: "0x5A"      # factory default of the MLX90614

# --- inputs ---
pin_rain: 25                  # GPIO number, `none` if rain is false. Needs a pin with a pull-up (not 34..39)
rain_inverted: true           # true: LOW = wet: the module pulls its output LOW, or a relay contact to GND closes
pin_wind: 26                  # GPIO number, `none` if no wind sensor is built. Needs a pin with a pull-up (not 34..39)
wind_filter: 5ms              # debounce of the reed contact (shorter than the fastest revolution)
