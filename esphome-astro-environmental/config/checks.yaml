# Checks of astro-environmental-config.yaml. A wrong value includes a file that does not exist; its name tells what is
# wrong ("Error including file ... CONFIG_ERROR_...") when ESPHome validates or compiles the configuration.
# (paths in a package file are relative to this file)
# i2c_on, bme280_on, sky_on, wind_on, sqm_on are derived in station.yaml from the groups and the single sensors
# (1 = built, 0 = not built, used as `x | int`).
substitutions:
  # the boards this configuration knows
  hw_known: ${ hardware in ['esp32_devkit'] }

  # GPIOs of an ESP32 DevKit that can be used: GPIO6..11 are the flash, 20/24/28..31 do not exist
  gpio_usable: ${ range(0, 40) | reject('in', [6, 7, 8, 9, 10, 11, 20, 24, 28, 29, 30, 31]) | list }
  # GPIO34..39 can only read: no pull-up, no output (not usable as SDA/SCL, and the reed contact and the rain input
  # need the internal pull-up)
  gpio_input_only: ${ [34, 35, 36, 37, 38, 39] }

  # is anything built at all, and the single sensor switches
  anything_built: ${ (bme280_on | int) > 0 or rain or (sky_on | int) > 0 or (wind_on | int) > 0 or (sqm_on | int) > 0 }
  sensor_switches: >-
    ${ [sensor_temperature, sensor_humidity, sensor_pressure, sensor_dew_point,
        sensor_sky_temperature, sensor_sky_ambient, sensor_sky_delta, sensor_cloud_cover,
        sensor_wind_speed, sensor_wind_gust,
        sensor_sky_quality, sensor_sky_illuminance, sensor_sky_luminance] }

  # the pins of what is built (a group without a sensor that is built needs no pin)
  pins_used: >-
    ${ ([pin_sda, pin_scl] if i2c_on | int else [])
       + ([pin_rain] if rain else [])
       + ([pin_wind] if wind_on | int else []) }

# ESPHome reports the check that comes LAST in this list first, so the basic values (board, log level, ...) are
# at the end: a typo there is reported on its own, not as a follow-up error of the checks above it.
packages:
  # --- wiring: numbers, duplicates, pins that cannot do the job ---
  check_rain_pull_up: !include checks/${'ok' if not rain or pin_rain not in gpio_input_only else 'CONFIG_ERROR_pin_rain_needs_a_pull_up_use_a_gpio_other_than_34_to_39'}.yaml
  check_wind_pull_up: !include checks/${'ok' if not wind_on | int or pin_wind not in gpio_input_only else 'CONFIG_ERROR_pin_wind_needs_a_pull_up_use_a_gpio_other_than_34_to_39'}.yaml
  check_i2c_pins: !include checks/${'ok' if not i2c_on | int or (pin_sda not in gpio_input_only and pin_scl not in gpio_input_only) else 'CONFIG_ERROR_pin_sda_and_pin_scl_must_not_be_an_input_only_gpio_34_to_39'}.yaml
  check_pins_unique: !include checks/${'ok' if pins_used | length == pins_used | unique | list | length else 'CONFIG_ERROR_a_pin_is_used_for_two_functions'}.yaml
  check_pin_numbers: !include checks/${'ok' if pins_used | select('in', gpio_usable) | list | length == pins_used | length else 'CONFIG_ERROR_a_pin_is_not_a_usable_gpio_number_of_this_board_or_none_for_a_sensor_that_is_built'}.yaml

  # --- I2C ---
  # the TSL2591 answers at 0x29 and the address cannot be changed
  check_tsl2591_address: !include checks/${'ok' if not sqm_on | int or not sky_on | int or (mlx90614_address | string) != '0x29' else 'CONFIG_ERROR_mlx90614_address_0x29_is_taken_by_the_tsl2591'}.yaml
  check_mlx90614_address: !include checks/${'ok' if not sky_on | int or ((mlx90614_address | string).startswith('0x') and (mlx90614_address | string) | length == 4) else 'CONFIG_ERROR_mlx90614_address_must_look_like_0x5A'}.yaml
  check_bme280_address: !include checks/${'ok' if not bme280_on | int or bme280_address in ['0x76', '0x77'] else 'CONFIG_ERROR_bme280_address_must_be_0x76_or_0x77'}.yaml

  # --- basic values ---
  check_any_sensor: !include checks/${'ok' if anything_built else 'CONFIG_ERROR_at_least_one_sensor_must_be_built'}.yaml
  check_sensor_switches: !include checks/${'ok' if sensor_switches | select('in', [true, false]) | list | length == sensor_switches | length else 'CONFIG_ERROR_a_sensor_switch_must_be_true_or_false'}.yaml
  check_rain_inverted: !include checks/${'ok' if rain_inverted in [true, false] else 'CONFIG_ERROR_rain_inverted_must_be_true_or_false'}.yaml
  check_sqm_value: !include checks/${'ok' if sqm in [true, false] else 'CONFIG_ERROR_sqm_must_be_true_or_false'}.yaml
  check_wind_value: !include checks/${'ok' if wind in [true, false] else 'CONFIG_ERROR_wind_must_be_true_or_false'}.yaml
  check_sky_value: !include checks/${'ok' if sky in [true, false] else 'CONFIG_ERROR_sky_must_be_true_or_false'}.yaml
  check_rain_value: !include checks/${'ok' if rain in [true, false] else 'CONFIG_ERROR_rain_must_be_true_or_false'}.yaml
  check_bme280_value: !include checks/${'ok' if bme280 in [true, false] else 'CONFIG_ERROR_bme280_must_be_true_or_false'}.yaml
  check_hardware: !include checks/${'ok' if hw_known else 'CONFIG_ERROR_hardware_is_not_a_known_board'}.yaml
  check_log_level: !include checks/${'ok' if log_level in ['DEBUG', 'INFO', 'WARN'] else 'CONFIG_ERROR_log_level_must_be_DEBUG_or_INFO_or_WARN'}.yaml
