# =========================================================
# FEATURE: SKY SENSOR (MLX90614 infrared thermometer)
#
# Requires the I2C bus (bus_a) of esphome-astro-environmental/hardware/hw_<hardware>_i2c.yaml.
#
# Sky Temperature      the infrared object temperature, averaged over 60 s
# Sky Sensor Ambient   the temperature of the sensor housing (diagnostic)
#
# A sensor that is switched off (sensor_sky_temperature, sensor_sky_ambient) is internal: it is not reported to
# Home Assistant. The calculated values are in features/sky_delta.yaml and features/cloud_cover.yaml.
# =========================================================

sensor:
  - platform: mlx90614
    i2c_id: bus_a
    address: ${mlx90614_address}
    update_interval: 10s
    ambient:
      name: "Sky Sensor Ambient"
      id: ent_sky_ambient
      internal: ${ not sensor_sky_ambient }
      entity_category: diagnostic
      accuracy_decimals: 1
    object:
      name: "Sky Temperature"
      id: ent_sky_temperature
      internal: ${ not sensor_sky_temperature }
      accuracy_decimals: 1
      filters:
        # 6 readings (60 s), a value every 3 readings (30 s)
        - sliding_window_moving_average:
            window_size: 6
            send_every: 3
            send_first_at: 1
