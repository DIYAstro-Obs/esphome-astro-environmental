# =========================================================
# FEATURE: BME280 - temperature, humidity, pressure
#
# Requires the I2C bus (bus_a) of esphome-astro-environmental/hardware/hw_<hardware>_i2c.yaml.
# The pressure is the station pressure (not reduced to sea level), which is what ASCOM expects.
# A sensor that is switched off (sensor_temperature, sensor_humidity, sensor_pressure in the configuration) is
# internal: it is not reported to Home Assistant. The dew point is in features/dew_point.yaml.
# =========================================================

sensor:
  - platform: bme280_i2c
    i2c_id: bus_a
    address: ${bme280_address}
    update_interval: 30s
    iir_filter: 4x
    temperature:
      name: "Temperature"
      id: ent_temperature
      internal: ${ not sensor_temperature }
      oversampling: 4x
      accuracy_decimals: 1
    pressure:
      name: "Pressure"
      id: ent_pressure
      internal: ${ not sensor_pressure }
      oversampling: 4x
      accuracy_decimals: 1
    humidity:
      name: "Humidity"
      id: ent_humidity
      internal: ${ not sensor_humidity }
      oversampling: 4x
      accuracy_decimals: 1
